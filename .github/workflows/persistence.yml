name: Persistence verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: persistence-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  persistence:
    name: Persistence drift
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify Docker availability
        shell: bash
        run: |
          set -Eeuo pipefail
          docker info >/dev/null
          docker version --format 'Docker server {{.Server.Version}}'

      - name: Run persistence verification
        shell: bash
        run: make persistence-check
