name: Terraform verification

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - "scripts/verify/terraform*"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - "Makefile"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - "scripts/verify/terraform*"
      - ".checkov.yaml"
      - ".tflint.hcl"
      - "Makefile"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform contracts, lint, policy, and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v5
        with:
          tflint_version: v0.64.0

      - name: Set up Infracost
        uses: infracost/actions/setup@v3
        with:
          version: 0.10.45

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.8

      - name: Verify pinned tools
        run: make terraform-tools-check

      - name: Run Terraform repository checks
        run: make terraform-check terraform-modules-check

      - name: Run Terraform lint and security checks
        run: make terraform-lint-check terraform-security-check
