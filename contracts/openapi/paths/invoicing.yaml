/invoicing/configuration/configure-invoice-templates:
  put:
    tags: [invoicing]
    operationId: invConfigureInvoiceTemplates
    x-owner-capability: invoicing
    x-permission: finance.inv.configure.invoice.templates
    parameters:
      - $ref: ../components/common.yaml#/headers/X-Correlation-Id
      - $ref: ../components/common.yaml#/headers/Accept-Language
      - $ref: ../components/common.yaml#/headers/X-Accounting-Scope-Id
      - $ref: ../components/common.yaml#/headers/Idempotency-Key-Required
      - $ref: ../components/common.yaml#/headers/If-Match
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/common.yaml#/schemas/InvConfigureInvoiceTemplatesCommandRequest }
          examples:
            deterministic:
              $ref: ../examples/command-request.yaml
    responses:
      '200': { $ref: ../components/common.yaml#/responses/Established }
      '400': { $ref: ../components/common.yaml#/responses/Problem }
      '401': { $ref: ../components/common.yaml#/responses/AuthenticationRequired }
      '403': { $ref: ../components/common.yaml#/responses/Problem }
      '409': { $ref: ../components/common.yaml#/responses/Problem }
      '422': { $ref: ../components/common.yaml#/responses/Problem }
      '503': { $ref: ../components/common.yaml#/responses/Problem }
