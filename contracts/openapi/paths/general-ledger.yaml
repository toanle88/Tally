                  fiscalPeriodId: 00000000-0000-0000-0000-000000000009
                  periodStateVersion: 2
                  postingGateVersion: 4
                  postingPurpose: Ordinary
                  transactionCurrency: USD
                  lines:
                    - accountId: 00000000-0000-0000-0000-000000000010
                      debitOrCredit: debit
                      lineCurrencyMode: TransactionAndFunctional
                      transactionAmount: '100.00'
                      functionalAmount: '100.00'
                      segmentCombinationId: 00000000-0000-0000-0000-000000000011
                    - accountId: 00000000-0000-0000-0000-000000000012
                      debitOrCredit: credit
                      lineCurrencyMode: TransactionAndFunctional
                      transactionAmount: '100.00'
                      functionalAmount: '100.00'
                      segmentCombinationId: 00000000-0000-0000-0000-000000000013
