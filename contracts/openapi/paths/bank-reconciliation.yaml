/bank-reconciliation/actions/import-statement:
  post:
    tags: [bank-reconciliation]
    operationId: bfrImportStatement
    x-owner-capability: bank-reconciliation
    x-permission: finance.bfr.import.statement
    parameters:
      - $ref: ../components/common.yaml#/headers/Authorization
      - $ref: ../components/common.yaml#/headers/X-Correlation-Id
      - $ref: ../components/common.yaml#/headers/Accept-Language
      - $ref: ../components/common.yaml#/headers/Idempotency-Key-Required
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../components/common.yaml#/schemas/CommandRequest }
          examples:
            deterministic:
              $ref: ../examples/command-request.yaml
    responses:
      '200': { $ref: ../components/common.yaml#/responses/Established }
      '400': { $ref: ../components/common.yaml#/responses/Problem }
      '403': { $ref: ../components/common.yaml#/responses/Problem }
      '409': { $ref: ../components/common.yaml#/responses/Problem }
      '422': { $ref: ../components/common.yaml#/responses/Problem }
      '503': { $ref: ../components/common.yaml#/responses/Problem }
