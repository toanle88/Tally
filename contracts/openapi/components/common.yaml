headers:
  Authorization:
    name: Authorization
    in: header
    required: true
    schema: { type: string }
    description: Bearer access token validated at the API authentication boundary.
  X-Correlation-Id:
    name: X-Correlation-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Idempotency-Key:
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string, minLength: 1 }
  Idempotency-Key-Required:
    name: Idempotency-Key
    in: header
    required: true
    schema: { type: string, minLength: 1 }
  If-Match:
    name: If-Match
    in: header
    required: false
    schema: { type: string }
  X-Accounting-Scope-Id:
    name: X-Accounting-Scope-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Accept-Language:
    name: Accept-Language
    in: header
    required: false
    schema: { type: string }
parameters:
  PageSize:
    name: page[size]
    in: query
    required: false
    schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  PageAfter:
    name: page[after]
    in: query
    required: false
    schema: { type: string }
  RecordType:
    name: recordType
    in: path
    required: true
    schema: { type: string }
  RecordId:
    name: recordId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
  BusinessIdentity:
    name: businessIdentity
    in: path
    required: true
    schema: { type: string }
  EvidenceId:
    name: evidenceId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
schemas:
  Uuid:
    type: string
    format: uuid
  Money:
    type: string
    pattern: '^-?[0-9]+(\.[0-9]+)?$'
    description: Exact-decimal monetary value represented as a JSON string.
    examples: ['1250.00']
  CurrencyCode:
    type: string
    pattern: '^[A-Z]{3}$'
    examples: [USD]
  CommandRequest:
    type: object
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 0 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      businessDate: { type: string, format: date }
      data: { type: object, additionalProperties: true }
  GlMaintainLedgersCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, accountingScopeId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/GlMaintainLedgersCommandData' }
  GlMaintainLedgersCommandData:
    type: object
    additionalProperties: false
    required: [action, legalEntityId, ledgerType, functionalCurrency, fiscalCalendarId, lifecycleStatus, effectiveDateFrom]
    properties:
      action:
        type: string
        enum: [create, update]
      ledgerId: { $ref: '#/schemas/Uuid' }
      legalEntityId: { $ref: '#/schemas/Uuid' }
      ledgerType: { type: string, minLength: 1, maxLength: 80 }
      functionalCurrency: { $ref: '#/schemas/CurrencyCode' }
      fiscalCalendarId: { $ref: '#/schemas/Uuid' }
      lifecycleStatus:
        type: string
        enum: [draft, active, suspended, retired]
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
  GlMaintainAccountingBooksCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, accountingScopeId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/GlMaintainAccountingBooksCommandData' }
  GlMaintainAccountingBooksCommandData:
    type: object
    additionalProperties: false
    required: [action, ledgerId, bookType, accountingBasis, postingPolicyVersion, lifecycleStatus, effectiveDateFrom]
    properties:
      action:
        type: string
        enum: [create, update]
      accountingBookId: { $ref: '#/schemas/Uuid' }
      ledgerId: { $ref: '#/schemas/Uuid' }
      bookType: { type: string, minLength: 1, maxLength: 80 }
      accountingBasis: { type: string, minLength: 1, maxLength: 80 }
      postingPolicyVersion: { type: string, minLength: 1, maxLength: 120 }
      lifecycleStatus:
        type: string
        enum: [draft, active, suspended, retired]
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
  GlLedgerProjection:
    type: object
    additionalProperties: false
    required: [id, accountingScopeId, legalEntityId, ledgerType, functionalCurrency, fiscalCalendarId, lifecycleStatus, effectiveDateFrom, approvalStatus, validationOutcome, nextAction, version, revisionNumber]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      legalEntityId: { $ref: '#/schemas/Uuid' }
      ledgerType: { type: string }
      functionalCurrency: { $ref: '#/schemas/CurrencyCode' }
      fiscalCalendarId: { $ref: '#/schemas/Uuid' }
      lifecycleStatus: { type: string }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approvalStatus: { type: string }
      validationOutcome: { type: string }
      nextAction: { type: string }
      version: { type: integer, minimum: 1 }
      revisionNumber: { type: integer, minimum: 1 }
  GlAccountingBookProjection:
    type: object
    additionalProperties: false
    required: [id, accountingScopeId, ledgerId, bookType, accountingBasis, postingPolicyVersion, lifecycleStatus, effectiveDateFrom, approvalStatus, validationOutcome, nextAction, version, revisionNumber]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      ledgerId: { $ref: '#/schemas/Uuid' }
      bookType: { type: string }
      accountingBasis: { type: string }
      postingPolicyVersion: { type: string }
      lifecycleStatus: { type: string }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approvalStatus: { type: string }
      validationOutcome: { type: string }
      nextAction: { type: string }
      version: { type: integer, minimum: 1 }
      revisionNumber: { type: integer, minimum: 1 }
  GlMaintainLedgersResultData:
    type: object
    additionalProperties: false
    required: [ledger, validationOutcome, approvalStatus]
    properties:
      ledger: { $ref: '#/schemas/GlLedgerProjection' }
      decisionReference: { $ref: '#/schemas/Uuid' }
      policyReference: { type: string }
      validationOutcome: { type: string }
      approvalStatus: { type: string }
      replayed: { type: boolean }
  GlMaintainAccountingBooksResultData:
    type: object
    additionalProperties: false
    required: [accountingBook, validationOutcome, approvalStatus]
    properties:
      accountingBook: { $ref: '#/schemas/GlAccountingBookProjection' }
      decisionReference: { $ref: '#/schemas/Uuid' }
      policyReference: { type: string }
      validationOutcome: { type: string }
      approvalStatus: { type: string }
      replayed: { type: boolean }
  GlMaintainLedgersEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId:
        oneOf:
          - { $ref: '#/schemas/Uuid' }
          - { type: 'null' }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/GlMaintainLedgersResultData' }
  GlMaintainAccountingBooksEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId:
        oneOf:
          - { $ref: '#/schemas/Uuid' }
          - { type: 'null' }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/GlMaintainAccountingBooksResultData' }
  GlMaintainChartsOfAccountsCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, accountingScopeId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/GlMaintainChartsOfAccountsCommandData' }
  GlMaintainChartsOfAccountsCommandData:
    type: object
    additionalProperties: false
    required: [action, ledgerId, accountCodePolicy, lifecycleStatus, effectiveDateFrom]
    properties:
      action:
        type: string
        enum: [create, update]
      chartOfAccountsId: { $ref: '#/schemas/Uuid' }
      ledgerId: { $ref: '#/schemas/Uuid' }
      accountCodePolicy: { type: string, minLength: 1, maxLength: 120 }
      lifecycleStatus:
        type: string
        enum: [draft, active, suspended, retired]
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
  GlAccountRestriction:
    type: object
    additionalProperties: false
    required: [restrictionCode]
    properties:
      restrictionCode: { type: string, minLength: 1, maxLength: 120 }
      description: { type: string, maxLength: 500 }
  GlAccountReportingMapping:
    type: object
    additionalProperties: false
    required: [reportingDefinitionId, reportingLineCode, approved]
    properties:
      reportingDefinitionId: { $ref: '#/schemas/Uuid' }
      reportingLineCode: { type: string, minLength: 1, maxLength: 120 }
      approved: { type: boolean }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
  GlAccountProjection:
    type: object
    additionalProperties: false
    required: [id, accountingScopeId, chartOfAccountsId, accountCode, accountName, accountType, normalBalance, lifecycleStatus, restrictions, currencyPolicy, reportingMappings, effectiveDateFrom, approvalStatus, validationOutcome, nextAction, version, revisionNumber]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      chartOfAccountsId: { $ref: '#/schemas/Uuid' }
      accountCode: { type: string }
      accountName: { type: string }
      accountType: { type: string }
      normalBalance: { type: string, enum: [debit, credit] }
      lifecycleStatus: { type: string }
      restrictions:
        type: array
        items: { $ref: '#/schemas/GlAccountRestriction' }
      currencyPolicy: { type: string }
      reportingMappings:
        type: array
        items: { $ref: '#/schemas/GlAccountReportingMapping' }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approvalStatus: { type: string }
      validationOutcome: { type: string }
      nextAction: { type: string }
      version: { type: integer, minimum: 1 }
      revisionNumber: { type: integer, minimum: 1 }
  GlMaintainAccountsAndReportingMappingsCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, accountingScopeId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/GlMaintainAccountsAndReportingMappingsCommandData' }
  GlMaintainAccountsAndReportingMappingsCommandData:
    type: object
    additionalProperties: false
    required: [action, chartOfAccountsId, accountCode, accountName, accountType, normalBalance, lifecycleStatus, currencyPolicy, effectiveDateFrom]
    properties:
      action:
        type: string
        enum: [create, update]
      accountId: { $ref: '#/schemas/Uuid' }
      chartOfAccountsId: { $ref: '#/schemas/Uuid' }
      accountCode: { type: string, minLength: 1, maxLength: 80 }
      accountName: { type: string, minLength: 1, maxLength: 240 }
      accountType: { type: string, minLength: 1, maxLength: 80 }
      normalBalance:
        type: string
        enum: [debit, credit]
      lifecycleStatus:
        type: string
        enum: [draft, active, suspended, retired]
      restrictions:
        type: array
        items: { $ref: '#/schemas/GlAccountRestriction' }
      currencyPolicy: { type: string, minLength: 1, maxLength: 120 }
      reportingMappings:
        type: array
        items: { $ref: '#/schemas/GlAccountReportingMapping' }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
  GlMaintainChartsOfAccountsResultData:
    type: object
    additionalProperties: false
    required: [chartOfAccounts, validationOutcome, approvalStatus]
    properties:
      chartOfAccounts: { $ref: '#/schemas/GlChartOfAccountsProjection' }
      decisionReference: { $ref: '#/schemas/Uuid' }
      policyReference: { type: string }
      validationOutcome: { type: string }
      approvalStatus: { type: string }
      replayed: { type: boolean }
  GlMaintainAccountsAndReportingMappingsResultData:
    type: object
    additionalProperties: false
    required: [account, validationOutcome, approvalStatus]
    properties:
      account: { $ref: '#/schemas/GlAccountProjection' }
      decisionReference: { $ref: '#/schemas/Uuid' }
      policyReference: { type: string }
      validationOutcome: { type: string }
      approvalStatus: { type: string }
      replayed: { type: boolean }
  GlChartOfAccountsProjection:
    type: object
    additionalProperties: false
    required: [id, accountingScopeId, ledgerId, accountCodePolicy, lifecycleStatus, effectiveDateFrom, approvalStatus, validationOutcome, nextAction, version, revisionNumber]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      ledgerId: { $ref: '#/schemas/Uuid' }
      accountCodePolicy: { type: string }
      lifecycleStatus: { type: string }
      effectiveDateFrom: { type: string, format: date }
      effectiveDateTo:
        oneOf:
          - { type: string, format: date }
          - { type: 'null' }
      approvalStatus: { type: string }
      validationOutcome: { type: string }
      nextAction: { type: string }
      version: { type: integer, minimum: 1 }
      revisionNumber: { type: integer, minimum: 1 }
  GlMaintainChartsOfAccountsEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId:
        oneOf:
          - { $ref: '#/schemas/Uuid' }
          - { type: 'null' }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/GlMaintainChartsOfAccountsResultData' }
  GlMaintainAccountsAndReportingMappingsEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId:
        oneOf:
          - { $ref: '#/schemas/Uuid' }
          - { type: 'null' }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/GlMaintainAccountsAndReportingMappingsResultData' }
  IamManageUsersCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: '#/schemas/IamManageUsersCommandData' }
  IamManageUsersCommandData:
    type: object
    additionalProperties: false
    required: [action]
    properties:
      action:
        type: string
        enum: [create, update, activate, suspend, terminate]
      userId: { $ref: '#/schemas/Uuid' }
      authenticationSubject: { $ref: '#/schemas/IamAuthenticationSubject' }
      assignments:
        description: Required for update and interpreted as the complete replacement set; omit for lifecycle actions.
        type: array
        items: { $ref: '#/schemas/IamRoleAssignment' }
  IamAuthenticationSubject:
    type: object
    additionalProperties: false
    required: [oid, tid, sub]
    properties:
      oid: { type: string, minLength: 1 }
      tid: { type: string, minLength: 1 }
      sub: { type: string, minLength: 1 }
  IamRoleAssignment:
    type: object
    additionalProperties: false
    required: [roleId, scopeIds]
    properties:
      roleId: { $ref: '#/schemas/Uuid' }
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
  IamManageRolesCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: "#/schemas/Uuid" }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: "#/schemas/IamManageRolesCommandData" }
  IamManageRolesCommandData:
    type: object
    additionalProperties: false
    required: [action, name, grants, approval]
    properties:
      action:
        type: string
        enum: [create, update, retire]
      roleId: { $ref: "#/schemas/Uuid" }
      name: { type: string, minLength: 1, maxLength: 120 }
      grants:
        type: array
        items: { $ref: "#/schemas/IamPermissionGrant" }
      approval: { $ref: "#/schemas/IamApprovalDecisionReference" }
  IamManageSegregationRulesCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: "#/schemas/Uuid" }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: "#/schemas/IamManageSegregationRulesCommandData" }
  IamManageSegregationRulesCommandData:
    type: object
    additionalProperties: false
    required: [action, code, name, conflictingPermissions, enforcementMode, effectiveFrom, approval]
    properties:
      action:
        type: string
        enum: [create, update, retire]
      ruleId: { $ref: "#/schemas/Uuid" }
      code: { type: string, minLength: 1, maxLength: 160 }
      name: { type: string, minLength: 1, maxLength: 160 }
      conflictingPermissions:
        type: array
        minItems: 2
        uniqueItems: true
        items: { type: string, minLength: 1 }
      enforcementMode:
        type: string
        enum: [block, exception-required]
      scopeIds:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1 }
      amountThreshold: { $ref: "#/schemas/Money" }
      coolingOffSeconds: { type: integer, minimum: 0 }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
      approval: { $ref: "#/schemas/IamApprovalDecisionReference" }
  IamPermissionGrant:
    type: object
    additionalProperties: false
    required: [permission, scopeIds, effectiveFrom]
    properties:
      permission: { type: string, minLength: 1 }
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      effectiveFrom: { type: string, format: date }
      effectiveTo: { type: string, format: date }
  IamApprovalDecisionReference:
    type: object
    additionalProperties: false
    required: [approvalRequestId, decisionId, policyVersion, decisionVersion, subjectVersion, candidateFingerprint, approverUserId]
    properties:
      approvalRequestId: { $ref: "#/schemas/Uuid" }
      decisionId: { $ref: "#/schemas/Uuid" }
      policyVersion: { type: string, minLength: 1 }
      decisionVersion: { type: integer, minimum: 1 }
      subjectVersion: { type: integer, minimum: 1 }
      candidateFingerprint: { type: string, minLength: 1 }
      approverUserId: { $ref: "#/schemas/Uuid" }
  IamGrantEmergencyAccessCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: "#/schemas/Uuid" }
      data: { $ref: "#/schemas/IamGrantEmergencyAccessCommandData" }
  IamGrantEmergencyAccessCommandData:
    type: object
    additionalProperties: false
    required: [targetActorId, permissions, scopeIds, reasonCode, startsAt, expiresAt, approval]
    properties:
      targetActorId: { $ref: "#/schemas/Uuid" }
      permissions:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      reasonCode: { type: string, minLength: 1, maxLength: 160 }
      startsAt: { type: string, format: date-time }
      expiresAt: { type: string, format: date-time }
      approval: { $ref: "#/schemas/IamApprovalDecisionReference" }
  IamRevokeEmergencyAccessCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, expectedVersion, data]
    properties:
      commandId: { $ref: "#/schemas/Uuid" }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: "#/schemas/IamRevokeEmergencyAccessCommandData" }
  IamRevokeEmergencyAccessCommandData:
    type: object
    additionalProperties: false
    required: [grantId, reasonCode]
    properties:
      grantId: { $ref: "#/schemas/Uuid" }
      reasonCode: { type: string, minLength: 1, maxLength: 160 }
      reviewStatus:
        type: string
        enum: [pending, completed]
      reviewOutcomeCode: { type: string, minLength: 1, maxLength: 160 }
      reviewReference: { type: string, minLength: 1, maxLength: 240 }
  EstablishedResult:
    type: object
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 0 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { type: object, additionalProperties: true }
  Links:
    type: object
    required: [self]
    properties:
      self: { type: string }
      status: { type: string }
  Page:
    type: object
    required: [size]
    properties:
      size: { type: integer, minimum: 1, maximum: 200 }
      after: { type: string }
      hasMore: { type: boolean }
  ProblemFieldError:
    type: object
    required: [field, message]
    properties:
      field: { type: string }
      message: { type: string }
      code: { type: string }
  ProblemDetails:
    type: object
    required: [type, title, status, code, detail, correlationId]
    properties:
      type: { type: string, format: uri-reference }
      title: { type: string }
      status: { type: integer, minimum: 400, maximum: 599 }
      code: { type: string }
      detail: { type: string }
      correlationId: { $ref: '#/schemas/Uuid' }
      currentVersion: { type: integer, minimum: 0 }
      fieldErrors:
        type: array
        items: { $ref: '#/schemas/ProblemFieldError' }
responses:
  Established: { description: Established result, content: { application/json: { schema: { $ref: '#/schemas/EstablishedResult' } } } }
  AuthenticationRequired:
    description: Authentication is required or the supplied bearer token is invalid.
    headers:
      WWW-Authenticate:
        schema: { type: string }
        example: Bearer
    content: { application/problem+json: { schema: { $ref: '#/schemas/ProblemDetails' } } }
  Problem: { description: RFC 9457-style problem details, content: { application/problem+json: { schema: { $ref: '#/schemas/ProblemDetails' } } } }
