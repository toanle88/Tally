headers:
  Authorization:
    name: Authorization
    in: header
    required: true
    schema: { type: string }
    description: Bearer access token validated at the API authentication boundary.
  X-Correlation-Id:
    name: X-Correlation-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Idempotency-Key:
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string, minLength: 1 }
  Idempotency-Key-Required:
    name: Idempotency-Key
    in: header
    required: true
    schema: { type: string, minLength: 1 }
  If-Match:
    name: If-Match
    in: header
    required: false
    schema: { type: string }
  X-Accounting-Scope-Id:
    name: X-Accounting-Scope-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Accept-Language:
    name: Accept-Language
    in: header
    required: false
    schema: { type: string }
parameters:
  PageSize:
    name: page[size]
    in: query
    required: false
    schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  PageAfter:
    name: page[after]
    in: query
    required: false
    schema: { type: string }
  RecordType:
    name: recordType
    in: path
    required: true
    schema: { type: string }
  RecordId:
    name: recordId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
  BusinessIdentity:
    name: businessIdentity
    in: path
    required: true
    schema: { type: string }
  EvidenceId:
    name: evidenceId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
schemas:
  Uuid:
    type: string
    format: uuid
  Money:
    type: string
    pattern: '^-?[0-9]+(\.[0-9]+)?$'
    description: Exact-decimal monetary value represented as a JSON string.
    examples: ['1250.00']
  CurrencyCode:
    type: string
    pattern: '^[A-Z]{3}$'
    examples: [USD]
  CommandRequest:
    type: object
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 0 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      businessDate: { type: string, format: date }
      data: { type: object, additionalProperties: true }
  IamManageUsersCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: '#/schemas/IamManageUsersCommandData' }
  IamManageUsersCommandData:
    type: object
    additionalProperties: false
    required: [action]
    properties:
      action:
        type: string
        enum: [create, update, activate, suspend, terminate]
      userId: { $ref: '#/schemas/Uuid' }
      authenticationSubject: { $ref: '#/schemas/IamAuthenticationSubject' }
      assignments:
        description: Required for update and interpreted as the complete replacement set; omit for lifecycle actions.
        type: array
        items: { $ref: '#/schemas/IamRoleAssignment' }
  IamAuthenticationSubject:
    type: object
    additionalProperties: false
    required: [oid, tid, sub]
    properties:
      oid: { type: string, minLength: 1 }
      tid: { type: string, minLength: 1 }
      sub: { type: string, minLength: 1 }
  IamRoleAssignment:
    type: object
    additionalProperties: false
    required: [roleId, scopeIds]
    properties:
      roleId: { $ref: '#/schemas/Uuid' }
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
  IamManageRolesCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: "#/schemas/Uuid" }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: "#/schemas/IamManageRolesCommandData" }
  IamManageRolesCommandData:
    type: object
    additionalProperties: false
    required: [action, name, grants, approval]
    properties:
      action:
        type: string
        enum: [create, update, retire]
      roleId: { $ref: "#/schemas/Uuid" }
      name: { type: string, minLength: 1, maxLength: 120 }
      grants:
        type: array
        items: { $ref: "#/schemas/IamPermissionGrant" }
      approval: { $ref: "#/schemas/IamApprovalDecisionReference" }
  IamPermissionGrant:
    type: object
    additionalProperties: false
    required: [permission, scopeIds, effectiveFrom]
    properties:
      permission: { type: string, minLength: 1 }
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      effectiveFrom: { type: string, format: date }
      effectiveTo: { type: string, format: date }
  IamApprovalDecisionReference:
    type: object
    additionalProperties: false
    required: [approvalRequestId, decisionId, policyVersion, decisionVersion, subjectVersion, candidateFingerprint, approverUserId]
    properties:
      approvalRequestId: { $ref: "#/schemas/Uuid" }
      decisionId: { $ref: "#/schemas/Uuid" }
      policyVersion: { type: string, minLength: 1 }
      decisionVersion: { type: integer, minimum: 1 }
      subjectVersion: { type: integer, minimum: 1 }
      candidateFingerprint: { type: string, minLength: 1 }
      approverUserId: { $ref: "#/schemas/Uuid" }
  EstablishedResult:
    type: object
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 0 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { type: object, additionalProperties: true }
  Links:
    type: object
    required: [self]
    properties:
      self: { type: string }
      status: { type: string }
  Page:
    type: object
    required: [size]
    properties:
      size: { type: integer, minimum: 1, maximum: 200 }
      after: { type: string }
      hasMore: { type: boolean }
  ProblemFieldError:
    type: object
    required: [field, message]
    properties:
      field: { type: string }
      message: { type: string }
      code: { type: string }
  ProblemDetails:
    type: object
    required: [type, title, status, code, detail, correlationId]
    properties:
      type: { type: string, format: uri-reference }
      title: { type: string }
      status: { type: integer, minimum: 400, maximum: 599 }
      code: { type: string }
      detail: { type: string }
      correlationId: { $ref: '#/schemas/Uuid' }
      currentVersion: { type: integer, minimum: 0 }
      fieldErrors:
        type: array
        items: { $ref: '#/schemas/ProblemFieldError' }
responses:
  Established: { description: Established result, content: { application/json: { schema: { $ref: '#/schemas/EstablishedResult' } } } }
  AuthenticationRequired:
    description: Authentication is required or the supplied bearer token is invalid.
    headers:
      WWW-Authenticate:
        schema: { type: string }
        example: Bearer
    content: { application/problem+json: { schema: { $ref: '#/schemas/ProblemDetails' } } }
  Problem: { description: RFC 9457-style problem details, content: { application/problem+json: { schema: { $ref: '#/schemas/ProblemDetails' } } } }
