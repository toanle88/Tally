headers:
  Authorization:
    name: Authorization
    in: header
    required: true
    schema: { type: string }
    description: Bearer access token validated at the API authentication boundary.
  X-Correlation-Id:
    name: X-Correlation-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Idempotency-Key:
    name: Idempotency-Key
    in: header
    required: false
    schema: { type: string, minLength: 1 }
  Idempotency-Key-Required:
    name: Idempotency-Key
    in: header
    required: true
    schema: { type: string, minLength: 1 }
  If-Match:
    name: If-Match
    in: header
    required: false
    schema: { type: string }
  X-Accounting-Scope-Id:
    name: X-Accounting-Scope-Id
    in: header
    required: false
    schema: { $ref: '#/schemas/Uuid' }
  Accept-Language:
    name: Accept-Language
    in: header
    required: false
    schema: { type: string }
parameters:
  PageSize:
    name: page[size]
    in: query
    required: false
    schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  PageAfter:
    name: page[after]
    in: query
    required: false
    schema: { type: string }
  RecordType:
    name: recordType
    in: path
    required: true
    schema: { type: string }
  RecordId:
    name: recordId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
  BusinessIdentity:
    name: businessIdentity
    in: path
    required: true
    schema: { type: string }
  EvidenceId:
    name: evidenceId
    in: path
    required: true
    schema: { $ref: '#/schemas/Uuid' }
schemas:
  Uuid:
    type: string
    format: uuid
  Money:
    type: string
    pattern: '^-?[0-9]+(\.[0-9]+)?$'
    description: Exact-decimal monetary value represented as a JSON string.
    examples: ['1250.00']
  CurrencyCode:
    type: string
    pattern: '^[A-Z]{3}$'
    examples: [USD]
  CommandRequest:
    type: object
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 0 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      businessDate: { type: string, format: date }
      data: { type: object, additionalProperties: true }
  WfaMaintainApprovalPoliciesCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: '#/schemas/WfaMaintainApprovalPoliciesCommandData' }
  WfaMaintainApprovalPoliciesCommandData:
    type: object
    additionalProperties: false
    required: [action, code, name, applicability, scope, rules, steps, effectiveFrom]
    properties:
      action:
        type: string
        enum: [create, update, submitForApproval, activate]
      policyId: { $ref: '#/schemas/Uuid' }
      code: { type: string, minLength: 1, maxLength: 160 }
      name: { type: string, minLength: 1, maxLength: 200 }
      policyVersion: { type: string, minLength: 1, maxLength: 80 }
      applicability: { $ref: '#/schemas/WfaApprovalApplicability' }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      rules:
        type: array
        minItems: 1
        items: { $ref: '#/schemas/WfaApprovalRule' }
      steps:
        type: array
        minItems: 1
        items: { $ref: '#/schemas/WfaApprovalStepDefinition' }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
      submitForApproval: { type: boolean }
      reason: { type: string, minLength: 1, maxLength: 500 }
      dependentWorkflowImpact: { type: string, maxLength: 500 }
  WfaCreateApprovalRequestCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/WfaCreateApprovalRequestCommandData' }
  WfaCreateApprovalRequestCommandData:
    type: object
    additionalProperties: false
    required: [requestId, subjectId, subjectVersion, subjectFingerprint, subjectSnapshot, applicability, scope, amount, currency]
    properties:
      requestId: { $ref: '#/schemas/Uuid' }
      subjectId: { type: string, minLength: 1, maxLength: 240 }
      subjectVersion: { type: integer, minimum: 1 }
      subjectFingerprint: { type: string, minLength: 1, maxLength: 240 }
      subjectSnapshot: { $ref: '#/schemas/WfaApprovalSubjectSnapshot' }
      applicability: { $ref: '#/schemas/WfaApprovalApplicability' }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      transactionType: { type: string, maxLength: 120 }
      dataClassification: { type: string, maxLength: 80 }
      dimensions:
        type: object
        additionalProperties: { type: string, maxLength: 160 }
      amount: { $ref: '#/schemas/Money' }
      currency: { $ref: '#/schemas/CurrencyCode' }
  WfaDecideApprovalRequestCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, expectedVersion, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      data: { $ref: '#/schemas/WfaDecideApprovalRequestCommandData' }
  WfaDecideApprovalRequestCommandData:
    type: object
    additionalProperties: false
    required: [requestId, decisionId, stepId, outcome, policyVersion, subjectVersion, candidateFingerprint]
    properties:
      requestId: { $ref: '#/schemas/Uuid' }
      decisionId: { $ref: '#/schemas/Uuid' }
      stepId: { $ref: '#/schemas/Uuid' }
      outcome: { type: string, enum: [approved, rejected] }
      reason: { type: string, maxLength: 2000 }
      delegationId: { $ref: '#/schemas/Uuid' }
      delegationReference: { type: string, maxLength: 240, deprecated: true }
      policyVersion: { type: string, minLength: 1, maxLength: 80 }
      subjectVersion: { type: integer, minimum: 1 }
      candidateFingerprint: { type: string, minLength: 1, maxLength: 240 }
  WfaDelegateApprovalCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      data: { $ref: '#/schemas/WfaDelegateApprovalCommandData' }
  WfaDelegateApprovalCommandData:
    type: object
    additionalProperties: false
    required: [delegationId, delegateUserId, policyId, policyVersion, scope, effectiveFrom, effectiveTo]
    properties:
      delegationId: { $ref: '#/schemas/Uuid' }
      delegateUserId: { $ref: '#/schemas/Uuid' }
      policyId: { $ref: '#/schemas/Uuid' }
      policyVersion: { type: string, minLength: 1, maxLength: 80 }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
  WfaApprovalSubjectSnapshot:
    type: object
    additionalProperties: false
    required: [label]
    properties:
      label: { type: string, minLength: 1, maxLength: 240 }
      reference: { type: string, maxLength: 240 }
      summary: { type: string, maxLength: 2000 }
      amount: { $ref: '#/schemas/Money' }
      currency: { $ref: '#/schemas/CurrencyCode' }
  WfaApprovalApplicability:
    type: object
    additionalProperties: false
    required: [sourceContext, subjectType, operation]
    properties:
      sourceContext: { type: string, minLength: 1, maxLength: 120 }
      subjectType: { type: string, minLength: 1, maxLength: 120 }
      operation: { type: string, minLength: 1, maxLength: 160 }
      transactionTypes:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 120 }
      currencies:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/CurrencyCode' }
      dataClassifications:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 80 }
      dimensions:
        type: object
        additionalProperties: { type: string, minLength: 1, maxLength: 160 }
  WfaApprovalScope:
    type: object
    additionalProperties: false
    properties:
      scopeIds:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 160 }
      accountingScopeIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
      legalEntityIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
      businessUnitIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
      segmentIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
      accountIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
      fiscalPeriodIds:
        type: array
        uniqueItems: true
        items: { $ref: '#/schemas/Uuid' }
  WfaRoleRequirement:
    type: object
    additionalProperties: false
    required: [role, minimumApprovals, allowDelegation]
    properties:
      role: { type: string, minLength: 1, maxLength: 160 }
      minimumApprovals: { type: integer, minimum: 1 }
      allowDelegation: { type: boolean }
  WfaDelegationConfiguration:
    type: object
    additionalProperties: false
    required: [enabled, requiresIndependentApproval]
    properties:
      enabled: { type: boolean }
      delegateToRoles:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 160 }
      maximumDepth: { type: integer, minimum: 1 }
      requiresIndependentApproval: { type: boolean }
  WfaEscalationConfiguration:
    type: object
    additionalProperties: false
    required: [enabled]
    properties:
      enabled: { type: boolean }
      afterSeconds: { type: integer, minimum: 1 }
      escalateToRoles:
        type: array
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 160 }
  WfaApprovalRule:
    type: object
    additionalProperties: false
    required: [id, threshold, requiredRoles, delegation, escalation]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      name: { type: string, maxLength: 160 }
      threshold:
        type: object
        additionalProperties: false
        required: [currency]
        properties:
          minimum: { $ref: '#/schemas/Money' }
          maximum: { $ref: '#/schemas/Money' }
          currency: { $ref: '#/schemas/CurrencyCode' }
      requiredRoles:
        type: array
        minItems: 1
        items: { $ref: '#/schemas/WfaRoleRequirement' }
      delegation: { $ref: '#/schemas/WfaDelegationConfiguration' }
      escalation: { $ref: '#/schemas/WfaEscalationConfiguration' }
  WfaApprovalStepDefinition:
    type: object
    additionalProperties: false
    required: [id, sequence, name, requiredRoles, minimumApprovals, delegation, escalation]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      sequence: { type: integer, minimum: 1 }
      name: { type: string, minLength: 1, maxLength: 160 }
      requiredRoles:
        type: array
        minItems: 1
        items: { $ref: '#/schemas/WfaRoleRequirement' }
      minimumApprovals: { type: integer, minimum: 1 }
      delegation: { $ref: '#/schemas/WfaDelegationConfiguration' }
      escalation: { $ref: '#/schemas/WfaEscalationConfiguration' }
  WfaApprovalPolicyProjection:
    type: object
    additionalProperties: false
    required: [id, code, name, policyVersion, status, applicability, scope, rules, steps, effectiveFrom, activationOutcome, candidateFingerprint]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      code: { type: string }
      name: { type: string }
      policyVersion: { type: string }
      status: { type: string, enum: [Draft, PendingApproval, Active, Superseded] }
      applicability: { $ref: '#/schemas/WfaApprovalApplicability' }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      rules:
        type: array
        items: { $ref: '#/schemas/WfaApprovalRule' }
      steps:
        type: array
        items: { $ref: '#/schemas/WfaApprovalStepDefinition' }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
      approval: { $ref: '#/schemas/IamApprovalDecisionReference' }
      approvalRequestId: { $ref: '#/schemas/Uuid' }
      activationOutcome: { type: string }
      candidateFingerprint: { type: string, minLength: 1 }
      aggregateVersion: { type: integer, minimum: 1 }
  WfaApprovalRequestStep:
    type: object
    additionalProperties: false
    required: [id, sequence, requiredRoles, minimumApprovals, status]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      sequence: { type: integer, minimum: 1 }
      name: { type: string }
      requiredRoles:
        type: array
        items: { $ref: '#/schemas/WfaRoleRequirement' }
      minimumApprovals: { type: integer, minimum: 1 }
      delegation: { $ref: '#/schemas/WfaDelegationConfiguration' }
      escalation: { $ref: '#/schemas/WfaEscalationConfiguration' }
      status: { type: string }
  WfaApprovalDecisionProjection:
    type: object
    additionalProperties: false
    required: [id, decisionVersion, outcome, approverUserId, approverSubjectReference, reason, policyVersion, subjectVersion, candidateFingerprint, recordedAt]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      decisionVersion: { type: integer, minimum: 1 }
      outcome: { type: string, enum: [approved, rejected] }
      approverUserId: { $ref: '#/schemas/Uuid' }
      approverSubjectReference: { type: string, minLength: 1 }
      reason: { type: string }
      stepId: { $ref: '#/schemas/Uuid' }
      delegationReference: { type: string }
      policyVersion: { type: string, minLength: 1 }
      subjectVersion: { type: integer, minimum: 1 }
      candidateFingerprint: { type: string, minLength: 1 }
      recordedAt: { type: string, format: date-time }
  WfaDelegationProjection:
    type: object
    additionalProperties: false
    required: [id, delegatorUserId, delegateUserId, policyId, policyVersion, scope, effectiveFrom, effectiveTo, active, aggregateVersion, createdAt, updatedAt]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      delegatorUserId: { $ref: '#/schemas/Uuid' }
      delegateUserId: { $ref: '#/schemas/Uuid' }
      policyId: { $ref: '#/schemas/Uuid' }
      policyVersion: { type: string, minLength: 1 }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
      active: { type: boolean }
      aggregateVersion: { type: integer, minimum: 1 }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  WfaApprovalDecisionReference:
    type: object
    additionalProperties: false
    required: [approvalRequestId, decisionId, policyVersion, decisionVersion, subjectVersion, candidateFingerprint, approverUserId, decidedAt]
    properties:
      approvalRequestId: { $ref: '#/schemas/Uuid' }
      decisionId: { $ref: '#/schemas/Uuid' }
      policyVersion: { type: string, minLength: 1 }
      decisionVersion: { type: integer, minimum: 1 }
      subjectVersion: { type: integer, minimum: 1 }
      candidateFingerprint: { type: string, minLength: 1 }
      approverUserId: { $ref: '#/schemas/Uuid' }
      decidedAt: { type: string, format: date-time }
      appliedAt: { type: string, format: date-time }
  WfaApprovalRequestProjection:
    type: object
    additionalProperties: false
    required: [id, subjectType, subjectId, subjectVersion, subjectFingerprint, policyId, policyVersion, scope, steps, decisions, status, applicationStatus, aggregateVersion, responsibleRoles, createdAt, updatedAt]
    properties:
      id: { $ref: '#/schemas/Uuid' }
      subjectType: { type: string }
      subjectId: { type: string }
      subjectVersion: { type: integer, minimum: 1 }
      subjectFingerprint: { type: string }
      subjectSnapshot: { $ref: '#/schemas/WfaApprovalSubjectSnapshot' }
      snapshotFingerprint: { type: string }
      sourceContext: { type: string }
      operation: { type: string }
      transactionType: { type: string }
      dataClassification: { type: string }
      dimensions:
        type: object
        additionalProperties: { type: string }
      amount: { $ref: '#/schemas/Money' }
      currency: { $ref: '#/schemas/CurrencyCode' }
      policyId: { $ref: '#/schemas/Uuid' }
      policyVersion: { type: string }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      requesterUserId: { $ref: '#/schemas/Uuid' }
      requesterSubjectReference: { type: string }
      activeDelegation: { $ref: '#/schemas/WfaDelegationProjection' }
      steps:
        type: array
        items: { $ref: '#/schemas/WfaApprovalRequestStep' }
      decisions:
        type: array
        items: { $ref: '#/schemas/WfaApprovalDecisionProjection' }
      currentStepId: { $ref: '#/schemas/Uuid' }
      status: { type: string, enum: [Pending, Approved, Rejected] }
      applicationStatus: { type: string, enum: [not-reported] }
      aggregateVersion: { type: integer, minimum: 1 }
      responsibleRoles:
        type: array
        items: { type: string }
      dueAt: { type: string, format: date-time }
      createdAt: { type: string, format: date-time }
      updatedAt: { type: string, format: date-time }
  WfaCreateApprovalRequestResultData:
    type: object
    additionalProperties: false
    required: [request, validationStatus, approvalStatus, responsibleRoles, applicationStatus, replayed]
    properties:
      request: { $ref: '#/schemas/WfaApprovalRequestProjection' }
      validationStatus: { type: string }
      approvalStatus: { type: string }
      responsibleRoles:
        type: array
        items: { type: string }
      applicationStatus: { type: string, enum: [not-reported] }
      exception: { type: string }
      recoveryPath: { type: string }
      auditReference: { $ref: '#/schemas/Uuid' }
      replayed: { type: boolean }
  WfaCreateApprovalRequestEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/WfaCreateApprovalRequestResultData' }
  WfaApprovalRequestResultData:
    type: object
    additionalProperties: false
    required: [request, applicationStatus, replayed]
    properties:
      request: { $ref: '#/schemas/WfaApprovalRequestProjection' }
      validationStatus: { type: string }
      approvalStatus: { type: string }
      responsibleRoles:
        type: array
        items: { type: string }
      applicationStatus: { type: string, enum: [not-reported] }
      decision: { $ref: '#/schemas/WfaApprovalDecisionProjection' }
      decisionReference: { $ref: '#/schemas/WfaApprovalDecisionReference' }
      nextAction: { type: string }
      replayed: { type: boolean }
      exception: { type: string }
      recoveryPath: { type: string }
  WfaApprovalRequestEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/WfaApprovalRequestResultData' }
  WfaDelegateApprovalResultData:
    type: object
    additionalProperties: false
    required: [delegation, validationStatus, replayed]
    properties:
      delegation: { $ref: '#/schemas/WfaDelegationProjection' }
      validationStatus: { type: string }
      auditReference: { $ref: '#/schemas/Uuid' }
      replayed: { type: boolean }
  WfaDelegateApprovalEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/WfaDelegateApprovalResultData' }
  WfaApprovalRequestListResultData:
    type: object
    additionalProperties: false
    required: [requests, page]
    properties:
      requests:
        type: array
        items: { $ref: '#/schemas/WfaApprovalRequestProjection' }
      page: { $ref: '#/schemas/Page' }
  WfaApprovalRequestListEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 0 }
      processId: { oneOf: [{ $ref: '#/schemas/Uuid' }, { type: 'null' }] }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/WfaApprovalRequestListResultData' }
  WfaMaintainApprovalPoliciesResultData:
    type: object
    additionalProperties: false
    required: [policy, policyVersion, scope, approvalStatus, activationOutcome, dependentWorkflowImpact]
    properties:
      policy: { $ref: '#/schemas/WfaApprovalPolicyProjection' }
      policyVersion: { type: string }
      scope: { $ref: '#/schemas/WfaApprovalScope' }
      thresholds:
        type: array
        items: { $ref: '#/schemas/Money' }
      roles:
        type: array
        items: { type: string }
      effectiveFrom: { type: string, format: date-time }
      effectiveTo: { type: string, format: date-time }
      approvalStatus: { type: string }
      activationOutcome: { type: string }
      dependentWorkflowImpact: { type: string }
      approvalRequestId: { $ref: '#/schemas/Uuid' }
      decisionReference: { $ref: '#/schemas/Uuid' }
      auditReference: { $ref: '#/schemas/Uuid' }
      replayed: { type: boolean }
  WfaMaintainApprovalPoliciesEstablishedResult:
    type: object
    additionalProperties: false
    required: [status, aggregateId, aggregateVersion, correlationId, links, data]
    properties:
      status: { type: string, const: established }
      aggregateId: { $ref: '#/schemas/Uuid' }
      aggregateVersion: { type: integer, minimum: 1 }
      processId:
        oneOf:
          - { $ref: '#/schemas/Uuid' }
          - { type: 'null' }
      correlationId: { $ref: '#/schemas/Uuid' }
      links: { $ref: '#/schemas/Links' }
      data: { $ref: '#/schemas/WfaMaintainApprovalPoliciesResultData' }
  GlSubmitPostingRequestCommandRequest:
    type: object
    additionalProperties: false
    required: [commandId, accountingScopeId, data]
    properties:
      commandId: { $ref: '#/schemas/Uuid' }
      expectedVersion: { type: integer, minimum: 1 }
      accountingScopeId: { $ref: '#/schemas/Uuid' }
      businessDate: { type: string, format: date }
      data: { $ref: '#/schemas/GlSubmitPostingRequestCommandData' }
  GlSubmitPostingRequestCommandData:
    type: object
    additionalProperties: false
    required:
      - contractVersion
      - requestId
      - sourceContext
      - sourceAggregateType
      - sourceAggregateId
      - sourceVersion
      - tenantId
      - legalEntityId
      - ledgerId
      - accountingBookId
      - functionalCurrency
      - postingDate
      - fiscalPeriodId
      - periodStateVersion
      - postingGateVersion
      - postingPurpose
      - transactionCurrency
      - lines
    properties:
      contractVersion: { type: integer, const: 2 }
      requestId: { $ref: '#/schemas/Uuid' }
      sourceContext: { type: string, minLength: 1, maxLength: 120 }
      sourceAggregateType: { type: string, minLength: 1, maxLength: 120 }
      sourceAggregateId: { $ref: '#/schemas/Uuid' }
      sourceVersion: { type: integer, minimum: 1 }
      tenantId: { $ref: '#/schemas/Uuid' }
      legalEntityId: { $ref: '#/schemas/Uuid' }
      ledgerId: { $ref: '#/schemas/Uuid' }
      accountingBookId: { $ref: '#/schemas/Uuid' }
      functionalCurrency: { $ref: '#/schemas/CurrencyCode' }
      postingDate: { type: string, format: date }
      fiscalPeriodId: { $ref: '#/schemas/Uuid' }
      periodStateVersion: { type: integer, minimum: 1 }
      postingGateVersion: { type: integer, minimum: 1 }
      postingPurpose:
        type: string
        enum: [Ordinary, Close, ReopenCorrection, OperationalReopen, PolicyAdjustment]
      adjustmentPeriodIndicator: { type: boolean }
