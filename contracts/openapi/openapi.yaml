openapi: 3.1.0
info:
  title: TALLY Finance Platform API
  version: 1.0.0
  description: Contract-only HTTP boundary for the TALLY modular monolith.
  license:
    name: UNLICENSED
    identifier: UNLICENSED
servers:
  - url: /api/v1
tags:
  - { name: master-data, description: Organization and master-data configuration. }
  - { name: general-ledger, description: Ledger, journal, and posting controls. }
  - { name: accounts-payable, description: Vendor invoices and payable obligations. }
  - { name: accounts-receivable, description: Customer invoices, receipts, and receivables. }
  - { name: payroll, description: Payroll runs, corrections, and filing records. }
  - { name: invoicing, description: Invoice templates, schedules, and generation. }
  - { name: payments, description: Payment batches, instructions, and settlements. }
  - { name: reporting, description: Financial reporting and consolidation workflows. }
  - { name: intercompany, description: Intercompany matching and settlement. }
  - { name: revenue-recognition, description: Revenue contracts and recognition schedules. }
  - { name: fixed-assets, description: Fixed-asset lifecycle and accounting actions. }
  - { name: multi-currency, description: Currency rates, revaluation, and translation. }
  - { name: fiscal-periods, description: Fiscal-period and close controls. }
  - { name: coa-segments, description: Chart-of-accounts segment configuration. }
  - { name: bank-reconciliation, description: Bank feeds, matching, and reconciliation. }
  - { name: tax, description: Tax configuration, returns, and submissions. }
  - { name: approvals, description: Approval policies, decisions, and delegation. }
  - { name: identity-access, description: Identity, access, and authorization boundaries. }
  - { name: audit-integrity, description: Audit evidence and integrity verification. }
paths:
  $ref: ./paths/catalog.yaml
security:
  - BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    Authorization: { $ref: ./components/common.yaml#/headers/Authorization }
    X-Correlation-Id: { $ref: ./components/common.yaml#/headers/X-Correlation-Id }
    Idempotency-Key: { $ref: ./components/common.yaml#/headers/Idempotency-Key }
    If-Match: { $ref: ./components/common.yaml#/headers/If-Match }
    X-Accounting-Scope-Id: { $ref: ./components/common.yaml#/headers/X-Accounting-Scope-Id }
    Accept-Language: { $ref: ./components/common.yaml#/headers/Accept-Language }
  parameters:
    PageSize: { $ref: ./components/common.yaml#/parameters/PageSize }
    PageAfter: { $ref: ./components/common.yaml#/parameters/PageAfter }
    RecordType: { $ref: ./components/common.yaml#/parameters/RecordType }
    RecordId: { $ref: ./components/common.yaml#/parameters/RecordId }
    BusinessIdentity: { $ref: ./components/common.yaml#/parameters/BusinessIdentity }
    EvidenceId: { $ref: ./components/common.yaml#/parameters/EvidenceId }
  schemas:
    Uuid: { $ref: ./components/common.yaml#/schemas/Uuid }
    Money: { $ref: ./components/common.yaml#/schemas/Money }
    CurrencyCode: { $ref: ./components/common.yaml#/schemas/CurrencyCode }
    CommandRequest: { $ref: ./components/common.yaml#/schemas/CommandRequest }
    ExactDecimal: { $ref: ./components/common.yaml#/schemas/ExactDecimal }
    InvConfigureInvoiceTemplatesCommandRequest: { $ref: ./components/common.yaml#/schemas/InvConfigureInvoiceTemplatesCommandRequest }
    InvConfigureInvoiceTemplatesCommandData: { $ref: ./components/common.yaml#/schemas/InvConfigureInvoiceTemplatesCommandData }
    InvTemplateLineItem: { $ref: ./components/common.yaml#/schemas/InvTemplateLineItem }
    InvTemplateChargeRule: { $ref: ./components/common.yaml#/schemas/InvTemplateChargeRule }
    InvTemplatePaymentMethod: { $ref: ./components/common.yaml#/schemas/InvTemplatePaymentMethod }
    InvTemplateApplicability: { $ref: ./components/common.yaml#/schemas/InvTemplateApplicability }
    WfaMaintainApprovalPoliciesCommandRequest: { $ref: ./components/common.yaml#/schemas/WfaMaintainApprovalPoliciesCommandRequest }
    WfaMaintainApprovalPoliciesCommandData: { $ref: ./components/common.yaml#/schemas/WfaMaintainApprovalPoliciesCommandData }
    WfaApprovalApplicability: { $ref: ./components/common.yaml#/schemas/WfaApprovalApplicability }
    WfaApprovalScope: { $ref: ./components/common.yaml#/schemas/WfaApprovalScope }
    WfaRoleRequirement: { $ref: ./components/common.yaml#/schemas/WfaRoleRequirement }
    WfaDelegationConfiguration: { $ref: ./components/common.yaml#/schemas/WfaDelegationConfiguration }
    WfaEscalationConfiguration: { $ref: ./components/common.yaml#/schemas/WfaEscalationConfiguration }
    WfaApprovalRule: { $ref: ./components/common.yaml#/schemas/WfaApprovalRule }
    WfaApprovalStepDefinition: { $ref: ./components/common.yaml#/schemas/WfaApprovalStepDefinition }
    WfaApprovalPolicyProjection: { $ref: ./components/common.yaml#/schemas/WfaApprovalPolicyProjection }
    WfaMaintainApprovalPoliciesResultData: { $ref: ./components/common.yaml#/schemas/WfaMaintainApprovalPoliciesResultData }
    WfaMaintainApprovalPoliciesEstablishedResult: { $ref: ./components/common.yaml#/schemas/WfaMaintainApprovalPoliciesEstablishedResult }
    WfaCreateApprovalRequestCommandRequest: { $ref: ./components/common.yaml#/schemas/WfaCreateApprovalRequestCommandRequest }
    WfaCreateApprovalRequestCommandData: { $ref: ./components/common.yaml#/schemas/WfaCreateApprovalRequestCommandData }
    WfaApprovalSubjectSnapshot: { $ref: ./components/common.yaml#/schemas/WfaApprovalSubjectSnapshot }
    WfaApprovalRequestStep: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestStep }
    WfaApprovalRequestProjection: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestProjection }
    WfaCreateApprovalRequestResultData: { $ref: ./components/common.yaml#/schemas/WfaCreateApprovalRequestResultData }
    WfaCreateApprovalRequestEstablishedResult: { $ref: ./components/common.yaml#/schemas/WfaCreateApprovalRequestEstablishedResult }
    WfaApprovalRequestResultData: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestResultData }
    WfaApprovalRequestEstablishedResult: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestEstablishedResult }
    WfaApprovalRequestListResultData: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestListResultData }
    WfaApprovalRequestListEstablishedResult: { $ref: ./components/common.yaml#/schemas/WfaApprovalRequestListEstablishedResult }
    IamManageUsersCommandRequest: { $ref: ./components/common.yaml#/schemas/IamManageUsersCommandRequest }
    IamManageUsersCommandData: { $ref: ./components/common.yaml#/schemas/IamManageUsersCommandData }
    IamAuthenticationSubject: { $ref: ./components/common.yaml#/schemas/IamAuthenticationSubject }
    IamRoleAssignment: { $ref: ./components/common.yaml#/schemas/IamRoleAssignment }
    EstablishedResult: { $ref: ./components/common.yaml#/schemas/EstablishedResult }
    Links: { $ref: ./components/common.yaml#/schemas/Links }
    Page: { $ref: ./components/common.yaml#/schemas/Page }
    ProblemFieldError: { $ref: ./components/common.yaml#/schemas/ProblemFieldError }
    ProblemDetails: { $ref: ./components/common.yaml#/schemas/ProblemDetails }
  responses:
    Established: { $ref: ./components/common.yaml#/responses/Established }
    AuthenticationRequired: { $ref: ./components/common.yaml#/responses/AuthenticationRequired }
    Problem: { $ref: ./components/common.yaml#/responses/Problem }
