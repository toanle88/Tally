version: "2"

sql:
  - name: platform
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/platform
    queries:
      - db/queries/platform
    gen:
      go:
        package: platformdb
        out: internal/platform/database/platformdb
        sql_package: pgx/v5
  - name: identity
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/identity
    queries:
      - db/queries/identity
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
  - name: organization
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/organization
    queries:
      - db/queries/organization
    gen:
      go:
        package: organizationdb
        out: internal/organization/organizationdb
        sql_package: pgx/v5
