version: "2"

sql:
  - name: platform
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/platform
    queries:
      - db/queries/platform
    gen:
      go:
        package: platformdb
        out: internal/platform/database/platformdb
        sql_package: pgx/v5
  - name: identity
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/identity
    queries:
      - db/queries/identity
    gen:
      go:
        package: identitydb
        out: internal/identity/identitydb
        sql_package: pgx/v5
  - name: organization
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/organization
    queries:
      - db/queries/organization
    gen:
      go:
        package: organizationdb
        out: internal/organization/organizationdb
        sql_package: pgx/v5
  - name: coa
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/coa
    queries:
      - db/queries/coa
    gen:
      go:
        package: coadb
        out: internal/coa/coadb
        sql_package: pgx/v5
  - name: gl
    engine: postgresql
    schema:
      - db/migrations/bootstrap
      - db/migrations/gl
    queries:
      - db/queries/gl
    gen:
      go:
        package: gldb
        out: internal/gl/gldb
        sql_package: pgx/v5
