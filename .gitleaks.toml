title = "Tally secret scanning configuration"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic workflow approval policy test fixture"
condition = "AND"
paths = ['''^internal/workflow/approval_policy_test\.go$''']
regexTarget = "line"
regexes = ['''IdempotencyKey:\s*"activate-policy-v2"''']

[[allowlists]]
description = "Historical deterministic GL idempotency fixtures"
condition = "AND"
paths = ['''^internal/gl/configuration_test\.go$''']
regexTarget = "line"
regexes = ['''IdempotencyKey:\s*"ledger-duplicate-[12]"''']

[[allowlists]]
description = "Deterministic GL posting integration fixtures"
condition = "AND"
paths = ['''^internal/platform/database/gl_posting_integration_test\.go$''']
regexTarget = "line"
regexes = [
  '''IdempotencyKey:\s*"approval-integration-1"''',
  '''IdempotencyKey:\s*"reversal-integration-1"''',
]

[[allowlists]]
description = "Deterministic GL posting barrier integration fixtures"
condition = "AND"
paths = ['''^internal/platform/database/gl_soft_close_gate_integration_test\.go$''']
regexTarget = "line"
regexes = [
  '''IdempotencyKey:\s*"integration-barrier-enter"''',
  '''IdempotencyKey:\s*"integration-barrier-acquire-[12]"''',
  '''IdempotencyKey:\s*"integration-barrier-release-1"''',
  '''IdempotencyKey:\s*"integration-barrier-finalize-1"''',
]
